name: smart_food_court
description: "Smart Food Court Ordering and Table Management System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Firebase Core
  firebase_core: ^3.0.0
  firebase_core_web: ^2.0.0
  
  # Firebase Auth
  firebase_auth: ^5.0.0
  firebase_auth_web: ^5.0.0
  
  # Firebase Firestore
  cloud_firestore: ^5.0.0
  cloud_firestore_web: ^4.0.0
  
  # Firebase Messaging
  firebase_messaging: ^15.0.0
  firebase_messaging_web: ^3.0.0

  # UI & Utilities
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  provider: ^6.1.0
  intl: ^0.19.0
  image_picker: ^1.0.7
  # qr_code_scanner: ^1.0.1   ❌ REMOVED - NOT COMPATIBLE WITH WEB

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true